  <script>
    // 自定义 Tailwind 主题色（马卡龙浅粉温柔配色）
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            blush: '#FFE3EC',      // 浅粉背景
            cream: '#FFF9F2',      // 米白
            rose:  '#F78FB3',      // 主粉色
            roseg: '#E8638C',      // 深粉（强调）
            cocoa: '#8A6552',      // 可可棕（正文文字）
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'PingFang SC',
                   'Hiragino Sans GB', 'Microsoft YaHei', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    /* ===== 禁止页面下拉回弹 / 橡皮筋效果 ===== */
    html, body {
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }
    body {
      position: fixed;       /* 锁定 body，彻底防止下拉回弹 */
      inset: 0;
      overflow-y: auto;
    }
    img { -webkit-touch-callout: none; }

    /* ===== 弹窗淡入淡出动画 ===== */
    .modal-mask {
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }
    .modal-mask.show { opacity: 1; pointer-events: auto; }
    .modal-box {
      transform: translateY(24px) scale(.96);
      opacity: 0;
      transition: transform .25s ease, opacity .25s ease;
    }
    .modal-mask.show .modal-box {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    /* ===== 已使用卡片：灰度 + 降透明度 ===== */
    .coupon-used {
      filter: grayscale(.85);
      opacity: .6;
    }

    /* ===== "已兑现" 印章样式 ===== */
    .stamp {
      transform: rotate(-18deg);
      border: 2.5px solid #E8638C;
      color: #E8638C;
      letter-spacing: 2px;
      text-shadow: 0 0 1px rgba(232, 99, 140, .4);
    }

    /* ===== 券切换滑动动画 ===== */
    #ticket {
      transition: transform .3s ease, opacity .3s ease;
    }
    /* 滑出/滑入中间态 */
    .slide-out-left  { transform: translateX(-60px) scale(.94); opacity: 0; }
    .slide-out-right { transform: translateX(60px) scale(.94);  opacity: 0; }
    .no-transition   { transition: none !important; }

    /* ===== 成功提示 toast 动画 ===== */
    #toast {
      opacity: 0;
      transform: translate(-50%, -10px);
      transition: opacity .3s ease, transform .3s ease;
    }
    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* 虚线打孔分隔线 */
    .perf-line {
      border-top: 2px dashed rgba(247, 143, 179, .45);
    }
  </style>
</head>

<body class="bg-gradient-to-b from-blush via-cream to-blush font-sans text-cocoa select-none">

  <!-- ============ 页面主体 ============ -->
  <div class="max-w-md mx-auto min-h-full px-5 pt-8 pb-10 flex flex-col">

    <!-- 顶部标题 -->
    <header class="text-center mb-4">
      <p class="text-[10px] tracking-[6px] text-rose/70 mb-1">LOVE COUPONS</p>
      <h1 class="text-2xl font-bold text-roseg">💕 情侣兑换券卡包</h1>
    </header>

    <!-- 剩余可用提示 -->
    <div id="remainTip" class="text-center text-xs text-cocoa/70 bg-white/70 rounded-full py-1.5 px-4 mx-auto w-max mb-4 shadow-sm"></div>

    <!-- ===== 单张券展示区（左右滑动切换） ===== -->
    <div id="swipeArea" class="flex-1 flex flex-col touch-pan-y">

      <!-- 票券主体 -->
      <div id="ticket" class="relative rounded-3xl overflow-hidden shadow-xl shadow-rose/20 bg-white">

        <!-- 券头部：插画区域（背景色由 JS 填充） -->
        <div id="tImgWrap" class="h-72 flex items-center justify-center relative">
          <img id="tImg" src="" alt="" class="max-h-full max-w-[85%] object-contain pointer-events-none rounded-2xl" />
          <!-- 图片加载失败时的占位图标 -->
          <div id="tImgFallback" class="hidden text-7xl">🎟️</div>
          <!-- 已兑现印章（已使用时显示） -->
          <div id="tStamp" class="stamp hidden absolute top-4 right-4 text-base font-bold px-2.5 py-1 rounded-lg bg-white/80">已兑现</div>
          <!-- 稀有款角标 -->
          <div id="tRare" class="hidden absolute top-4 left-4 text-[11px] font-bold text-white bg-gradient-to-r from-amber-400 to-rose px-2.5 py-1 rounded-full shadow">✨ 稀有款</div>
        </div>

        <!-- 打孔分隔线 -->
        <div class="relative">
          <div class="perf-line mx-5"></div>
          <div class="absolute left-0 top-1/2 -translate-y-1/2 w-5 h-5 bg-blush rounded-full -translate-x-1/2"></div>
          <div class="absolute right-0 top-1/2 -translate-y-1/2 w-5 h-5 bg-blush rounded-full translate-x-1/2"></div>
        </div>

        <!-- 券内容区 -->
        <div class="p-6 pt-4">
          <h2 id="tName" class="text-xl font-bold text-roseg text-center mb-4"></h2>

          <!-- 使用效果 -->
          <div class="flex items-start gap-2 mb-3">
            <span class="shrink-0 text-[11px] font-bold text-white bg-rose rounded-full px-2.5 py-1 mt-0.5">效果</span>
            <p id="tEffect" class="text-sm leading-relaxed text-cocoa/90"></p>
          </div>
          <!-- 备注 -->
          <div id="tRemarkRow" class="flex items-start gap-2">
            <span class="shrink-0 text-[11px] font-bold text-rose bg-rose/10 rounded-full px-2.5 py-1 mt-0.5">备注</span>
            <p id="tRemark" class="text-sm leading-relaxed text-cocoa/60"></p>
          </div>

          <!-- 使用按钮（已使用时隐藏） -->
          <button id="tUseBtn" onclick="openConfirm()"
            class="w-full mt-6 py-3.5 rounded-full bg-gradient-to-r from-rose to-roseg text-white text-base font-bold shadow-lg shadow-rose/40 active:scale-95 transition">
            🎁 立即使用
          </button>
          <p id="tUsedTip" class="hidden text-center text-sm text-cocoa/50 mt-6">— 这张券已经被兑现啦 —</p>

    ];

    // 券头部插画区背景色（马卡龙色系，按 id 取色）
    const cardColors = ['#FFE3EC','#FFF3D6','#E3F2FD','#E8F5E9','#F3E5F5','#FFEBE5'];

    /**
     * 加载使用状态：读 localStorage 里的 { 券id: true } 映射
     * （券内容以代码内数据为准，本地只同步"是否已使用"，改文案不会互相覆盖）
     */
    function loadUsedMap() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) { /* 数据损坏则视为空 */ }
      return {};
    }

    /** 把使用状态写回 localStorage */
    function saveUsedMap(map) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(map));
    }

    // 使用状态映射
    let usedMap = loadUsedMap();
    // 当前展示的券下标
    let currentIndex = 0;

    /** 判断某张券是否已使用 */
    const isUsed = c => !!usedMap[c.id];

    /* ================================================================
     * 渲染
     * ================================================================ */

    /**
     * 渲染当前券到票面
     */
    function renderTicket() {
      const c = couponList[currentIndex];
      const used = isUsed(c);

      // 插画区背景色 + 图片
      document.getElementById('tImgWrap').style.background =
        `linear-gradient(160deg, ${cardColors[(c.id - 1) % cardColors.length]}, #ffffff)`;
      const img = document.getElementById('tImg');
      const fallback = document.getElementById('tImgFallback');
      // 图片加载失败时隐藏图片、显示占位图标
      img.onerror = () => { img.classList.add('hidden'); fallback.classList.remove('hidden'); };
      img.onload = () => fallback.classList.add('hidden');
      img.src = c.img;
      img.alt = c.name;

      // 文案
      document.getElementById('tName').textContent = c.name + (c.rare ? '【稀有款】' : '');
      document.getElementById('tEffect').textContent = c.effect;
      document.getElementById('tRemark').textContent = c.remark || '无';
      document.getElementById('tRemarkRow').style.display = c.remark ? 'flex' : 'none';

      // 稀有款角标
      document.getElementById('tRare').classList.toggle('hidden', !c.rare);

      // 已使用状态：灰度 + 印章 + 隐藏使用按钮
      document.getElementById('ticket').classList.toggle('coupon-used', used);
      document.getElementById('tStamp').classList.toggle('hidden', !used);
      document.getElementById('tUseBtn').classList.toggle('hidden', used);
      document.getElementById('tUsedTip').classList.toggle('hidden', !used);

      // 页码 & 圆点指示器
      document.getElementById('pageIndicator').textContent = `${currentIndex + 1} / ${couponList.length}`;
      renderDots();

      // 更新剩余可用提示
      const remain = couponList.filter(c => !isUsed(c)).length;
      document.getElementById('remainTip').textContent = `💖 还剩 ${remain} 张券可用，共 ${couponList.length} 张`;
    }

    /**
     * 渲染底部圆点指示器
     */
    function renderDots() {
      const dots = document.getElementById('dots');
      dots.innerHTML = '';
      couponList.forEach((c, i) => {
        const d = document.createElement('span');
        d.className = 'rounded-full transition-all duration-300 '
          + (i === currentIndex ? 'w-4 h-1.5 bg-roseg' : 'w-1.5 h-1.5 bg-rose/30');
        dots.appendChild(d);
      });
    }

    /* ================================================================
     * 左右滑动 / 按钮切换
     * ================================================================ */

    /**
     * 切换到指定下标的券（带滑出滑入动画）
     * @param newIndex 目标下标
     * @param dir 滑动方向：1 = 往左滑出（看下一张），-1 = 往右滑出（看上一张）
     */
    function switchTo(newIndex, dir) {
      // 越界或动画中则忽略
      if (newIndex < 0 || newIndex >= couponList.length || switching) return;
      switching = true;

      const ticket = document.getElementById('ticket');
      // 1. 当前券滑出
      ticket.classList.add(dir === 1 ? 'slide-out-left' : 'slide-out-right');
      setTimeout(() => {
        // 2. 换内容并瞬间移到另一侧（关闭过渡）
        currentIndex = newIndex;
        ticket.classList.add('no-transition');
        ticket.classList.remove('slide-out-left', 'slide-out-right');
        ticket.classList.add(dir === 1 ? 'slide-out-right' : 'slide-out-left');
        renderTicket();
        // 3. 强制回流后，滑入到位
        void ticket.offsetWidth;
        ticket.classList.remove('no-transition', 'slide-out-left', 'slide-out-right');
        setTimeout(() => switching = false, 300);
      }, 280);
    }

    const prevCoupon = () => switchTo(currentIndex - 1, -1);
    const nextCoupon = () => switchTo(currentIndex + 1, 1);

    // 动画锁，防止连点错乱
    let switching = false;

    /* ===== 触摸滑动事件 ===== */
    const swipeArea = document.getElementById('swipeArea');
    let startX = 0, startY = 0, tracking = false;

    swipeArea.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });

    swipeArea.addEventListener('touchend', e => {
      if (!tracking) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      // 水平滑动距离 > 50px 且明显大于垂直距离，才算切换手势
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        dx < 0 ? nextCoupon() : prevCoupon();
      }
    }, { passive: true });

    /* ================================================================
     * 使用流程
     * ================================================================ */

    /** 打开弹窗 */
    function openModal(id) { document.getElementById(id).classList.add('show'); }

    /** 关闭弹窗 */
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    /**
     * 打开使用确认弹窗（二次确认）
     */
    function openConfirm() {
      const c = couponList[currentIndex];
      if (isUsed(c)) return;
      document.getElementById('cName').textContent = c.name;
      openModal('confirmModal');
    }

    /**
     * 确认兑现：标记已使用 → 写 localStorage → 刷新票面 → 弹成功提示
     */
    function confirmUse() {
      const c = couponList[currentIndex];
      usedMap[c.id] = true;
      saveUsedMap(usedMap);
      renderTicket();
      closeModal('confirmModal');
      showToast();
    }

    /**
     * 成功提示 toast（2 秒后自动消失）
     */
    function showToast() {
      const t = document.getElementById('toast');
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    /* ================================================================
     * 事件绑定与初始化
     * ================================================================ */

    // 点击确认弹窗遮罩关闭（点内容本身不关闭）
    document.getElementById('confirmModal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal('confirmModal');
    });

    // 首次渲染
    renderTicket();
  </script>
